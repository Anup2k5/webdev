<!DOCTYPE html>
<html>
<head>
<title>CRM Login</title>
<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.login-box {
  background: white;
  padding: 30px;
  width: 300px;
  border-radius: 10px;
  box-shadow: 0 0 10px gray;
}
h2 { text-align: center; }
input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
}
button {
  width: 100%;
  padding: 10px;
  background: #1976D2;
  color: white;
  border: none;
}
a {
  display: block;
  text-align: center;
  margin-top: 10px;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>CRM Login</h2>
  <input type="text" placeholder="Email">
  <input type="password" placeholder="Password">
  <button>Login</button>
  <a href="#">Forgot Password?</a>
</div>

</body>
</html>
